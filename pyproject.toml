[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frtbot"
version = "0.1.0"
description = "FRTBOT global multi-market ML/DL research POC (research/paper-simulation only, not investment advice)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - internal research use only" }
authors = [{ name = "FRTBOT research" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
data = [
  "yfinance>=0.2.40",
  "pandas-market-calendars>=4.4",
]
ml = [
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "torch>=2.2",
]
notebook = [
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "plotly>=5.22",
  "nbformat>=5.10",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frtbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["frtbot"]
